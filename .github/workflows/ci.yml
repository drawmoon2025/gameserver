name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - run: bash scripts/verify.sh
      - name: Upload lock files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock
          path: |
            go.mod
            go.sum
            gen/
      - name: Race detector
        run: go test -race -count=1 -timeout 180s ./...
