services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: game
    ports: ["3306:3306"]
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
  kafka:
    profiles: ["kafka"] # docker compose --profile kafka up
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
