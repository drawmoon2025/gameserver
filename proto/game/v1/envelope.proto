syntax = "proto3";

package game.v1;

option go_package = "github.com/drawmoon2025/gameserver/gen/game/v1;gamev1";

// Envelope wraps every client<->server message on WebSocket and HTTP alike.
message Envelope {
  uint32 msg_id = 1;      // Business message type (see MsgId).
  uint64 seq = 2;         // Server->client sequence; 0 means "not replayable".
  uint64 ack = 3;         // Client->server: highest server seq received.
  uint64 client_seq = 4;  // Client->server: strictly increasing per session.
  string request_id = 5;  // Idempotency key for anything that moves value.
  int32 code = 6;         // 0 = OK, see ErrorCode.
  bytes payload = 7;      // Serialized business message.
  uint32 channel = 8;     // Which ConnectReq binding this frame belongs to.
}

enum MsgId {
  MSG_ID_UNSPECIFIED = 0;
  MSG_ID_HEARTBEAT = 1;
  MSG_ID_CONNECT_REQ = 2;
  MSG_ID_RESUME_RSP = 3;
  MSG_ID_KICK = 4;

  MSG_ID_ROOM_ACTION_REQ = 1001;
  MSG_ID_ROOM_ACTION_RSP = 1002;
  MSG_ID_ROOM_SNAPSHOT = 1003;

  MSG_ID_SPIN_REQ = 2001;
  MSG_ID_SPIN_RSP = 2002;

  MSG_ID_MARCH_REQ = 3001;
  MSG_ID_MARCH_RSP = 3002;
  MSG_ID_MARCH_ARRIVED = 3003;
  MSG_ID_WORLD_SNAPSHOT = 3004;
  MSG_ID_MAP_VIEW_REQ = 3005;
  MSG_ID_MAP_VIEW_RSP = 3006;
  MSG_ID_RECALL_REQ = 3007;  // Answered by MSG_ID_MARCH_RSP.

  MSG_ID_CITY_UPGRADE_REQ = 4001;
  MSG_ID_CITY_UPGRADE_RSP = 4002;
  MSG_ID_CITY_UPGRADED = 4003;
  MSG_ID_CITY_SNAPSHOT = 4004;
  MSG_ID_CITY_TRAIN_REQ = 4005;
  MSG_ID_CITY_TRAIN_RSP = 4006;
  MSG_ID_CITY_TRAINED = 4007;

  MSG_ID_MAIL_CLAIM_REQ = 5001;
  MSG_ID_MAIL_CLAIM_RSP = 5002;
  MSG_ID_MAIL_NEW = 5003;
  MSG_ID_MAIL_SNAPSHOT = 5004;

  MSG_ID_ALLIANCE_CREATE_REQ = 6001;
  MSG_ID_ALLIANCE_JOIN_REQ = 6002;
  MSG_ID_ALLIANCE_LEAVE_REQ = 6003;
  MSG_ID_ALLIANCE_KICK_REQ = 6004;
  MSG_ID_ALLIANCE_RSP = 6005;
  MSG_ID_ALLIANCE_SNAPSHOT = 6006;

  MSG_ID_CHAT_SEND_REQ = 7001;
  MSG_ID_CHAT_SEND_RSP = 7002;
  MSG_ID_CHAT_MESSAGE = 7003;
  MSG_ID_CHAT_SNAPSHOT = 7004;

  MSG_ID_RANK_QUERY_REQ = 8001;
  MSG_ID_RANK_QUERY_RSP = 8002;
  MSG_ID_RANK_SNAPSHOT = 8003;
}

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_UNAUTHORIZED = 2;
  ERROR_CODE_RATE_LIMITED = 3;
  ERROR_CODE_INSUFFICIENT_FUNDS = 4;
  ERROR_CODE_DUPLICATE_IN_PROGRESS = 5;
  ERROR_CODE_INTERNAL = 6;
  ERROR_CODE_BUSY = 7;
  ERROR_CODE_NOT_ENOUGH_TROOPS = 8;
}

// Binding attaches the connection to one backend. An SLG client binds world,
// alliance, chat and so on over a single socket. Its index is the channel.
message Binding {
  string service = 1;
  string key = 2;       // Room or kingdom id; picks the owning node.
  uint64 last_seq = 3;  // Highest seq seen for this service and key; 0 when fresh.
}

// ConnectReq must be the first frame. A browser cannot set WebSocket headers,
// and a token in the URL would end up in access logs.
message ConnectReq {
  string token = 1;
  repeated Binding bindings = 2;
}

message LoginReq {
  string provider = 1;    // "local" or a registered third-party name.
  string username = 2;    // Local provider only.
  string credential = 3;  // Password, or the third party's token.
}

message LoginRsp {
  string token = 1;
  int64 uid = 2;
  int64 expires_at_ms = 3;
}

// ServerInfo is one kingdom in the HTTP server list.
message ServerInfo {
  string id = 1;
  string name = 2;
  string ws_url = 3;  // Where to open the WebSocket.
  bool full = 4;
  int32 load = 5;     // Population as a percentage of capacity.
}

message ServerList {
  repeated ServerInfo servers = 1;
  string current = 2;  // This player's kingdom; empty before the first entry.
}

message EnterServerReq {
  string id = 1;
}

message EnterServerRsp {
  ServerInfo server = 1;
  int32 base_x = 2;
  int32 base_y = 3;
}

message ResumeRsp {
  bool replayed = 1;   // true: missed frames follow; false: a snapshot follows.
  uint64 next_seq = 2;
}

message Kick {
  string reason = 1;
}

message RoomActionReq {
  int32 delta = 1;
}

message RoomActionRsp {
  int64 value = 1;
}

message RoomSnapshot {
  string room_id = 1;
  int64 value = 2;
  repeated int64 members = 3;
}

message SpinReq {
  int64 bet = 1;
}

message SpinRsp {
  repeated int32 reels = 1;
  int64 win = 2;
  int64 balance = 3;
  uint64 round_id = 4;
}

message MarchReq {
  int32 to_x = 1;
  int32 to_y = 2;
  int64 troops = 3;
}

message MarchRsp {
  uint64 march_id = 1;
  int64 arrive_at_ms = 2;
}

message MarchArrived {
  uint64 march_id = 1;
  int32 x = 2;
  int32 y = 3;
  int64 troops = 4;  // Those left after any battle.
  bool home = 5;     // A recalled army reached the city.
}

// MarchInfo is an army on the road.
message MarchInfo {
  uint64 march_id = 1;
  int32 to_x = 2;
  int32 to_y = 3;
  int64 troops = 4;
  int64 arrive_at_ms = 5;
  bool home = 6;
}

message Tile {
  int32 x = 1;
  int32 y = 2;
  int64 uid = 3;
  int64 troops = 4;
}

message WorldSnapshot {
  string kingdom = 1;
  int32 base_x = 2;
  int32 base_y = 3;
  int32 map_size = 4;
  int64 troops = 5;         // Held on tiles, summed over all of them.
  repeated Tile tiles = 6;  // This player's, up to the first 1000.
  repeated MarchInfo marches = 7;
}

// MapViewReq asks for the tiles around a point. It is a read, not a subscription.
message MapViewReq {
  int32 x = 1;
  int32 y = 2;
}

message MapViewRsp {
  repeated Tile tiles = 1;
}

// RecallReq sends troops from a held tile back to the city.
message RecallReq {
  int32 x = 1;
  int32 y = 2;
  int64 troops = 3;
}

message Building {
  string kind = 1;
  int32 level = 2;
}

message CityUpgrade {
  uint64 upgrade_id = 1;
  string kind = 2;
  int32 to_level = 3;
  int64 finish_at_ms = 4;
}

message CityTraining {
  uint64 training_id = 1;
  int64 count = 2;
  int64 finish_at_ms = 3;
}

message CitySnapshot {
  int64 gold = 1;
  repeated Building buildings = 2;
  repeated CityUpgrade upgrades = 3;
  int64 troops = 4;  // Ready in the city.
  repeated CityTraining training = 5;
}

message CityTrainReq {
  int64 count = 1;
}

message CityTrainRsp {
  CityTraining training = 1;
  int64 gold = 2;
}

message CityTrained {
  int64 count = 1;
}

message CityUpgradeReq {
  string kind = 1;
}

message CityUpgradeRsp {
  CityUpgrade upgrade = 1;
  int64 gold = 2;
}

message CityUpgraded {
  string kind = 1;
  int32 level = 2;
}

message Mail {
  uint64 mail_id = 1;
  string kind = 2;
  string title = 3;
  string body = 4;
  int64 reward_gold = 5;
  bool claimed = 6;
  int64 sent_at_ms = 7;
}

message MailSnapshot {
  repeated Mail mail = 1;  // Newest first.
}

message MailNew {
  Mail mail = 1;
}

message MailClaimReq {
  uint64 mail_id = 1;
}

message MailClaimRsp {
  uint64 mail_id = 1;
  int64 gold = 2;
}

message AllianceInfo {
  string name = 1;
  int64 leader = 2;           // 0: no such alliance.
  repeated int64 members = 3;  // By join order.
}

message AllianceKickReq {
  int64 uid = 1;
}

message ChatMessage {
  uint64 message_id = 1;
  int64 uid = 2;
  string text = 3;
  int64 sent_at_ms = 4;
}

message ChatSnapshot {
  string channel = 1;
  repeated ChatMessage messages = 2;  // Oldest first.
}

message ChatSendReq {
  string text = 1;
}

message ChatPush {
  string channel = 1;
  ChatMessage message = 2;
}

message RankEntry {
  int64 uid = 1;
  int64 score = 2;
  int64 rank = 3;
}

message RankBoard {
  string board = 1;
  repeated RankEntry entries = 2;
  int64 self_rank = 3;  // 0: not on the board.
  int64 self_score = 4;
}
