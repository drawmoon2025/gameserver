services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: game
    ports: ["3306:3306"]
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the temporary server that applies the schema has no network.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdev", "--silent"]
      interval: 2s
      retries: 60
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports: ["2379:2379"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      retries: 30
  kafka:
    profiles: ["kafka"] # docker compose --profile kafka up
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 3s
      retries: 40
